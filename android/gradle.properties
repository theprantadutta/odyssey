org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# Resources are shrunk as part of R8's own reference graph rather than in a
# separate pass afterwards, so a resource kept alive only by code R8 has just
# removed goes with it.
#
# AGP 9 turns this on by default; the line was here pinning the old behaviour,
# which is what Play Console flags as "Optimized resource shrinking isn't
# enabled". Flutter's Gradle plugin already sets isMinifyEnabled and
# isShrinkResources on the release build type, so nothing else is needed.
android.r8.optimizedResourceShrinking=true
android.builtInKotlin=false
android.newDsl=false

# Kotlin compiles in its own daemon rather than through the in-process Build
# Tools API, and without incremental caches.
#
# On Gradle 9.7 / AGP 9.4 the in-process path (BuildToolsApiCompilationWork)
# fails on Windows with "Could not close incremental caches ... *.tab" for any
# plugin module it compiles - file_picker here. It is not stale state: deleting
# build/ entirely and rebuilding reproduces it on the freshly created caches.
#
# The cause is the drive split. This project lives on G:\ while the Pub cache
# lives on C:\, and Kotlin's incremental compiler computes a relative path from
# each plugin's source to the project directory. Windows cannot express that
# across drive letters, and the cache-close step crashes on it.
#
# Turning the caches off sidesteps the path maths entirely. The cost is small:
# it touches only Kotlin sources, which here are a handful of plugin modules
# plus MainActivity. Every line of the app itself is Dart, which has its own
# incremental pipeline and is untouched.
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=false
