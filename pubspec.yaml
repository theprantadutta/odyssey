name: odyssey
description: "A new Flutter project."

publish_to: 'none'

version: 3.0.0+18

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.0

  # HTTP & API
  dio: ^5.7.0
  # The cache manager's FileService contract is expressed in package:http types,
  # so the authenticated media fetch layer speaks them directly.
  http: ^1.6.0
  retrofit: ^4.4.1
  json_annotation: ^4.9.0

  # Secure Storage (JWT tokens)
  flutter_secure_storage: ^10.0.0

  # Firebase & Google Sign-In
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  firebase_analytics: ^12.1.2
  firebase_messaging: ^16.1.0
  firebase_crashlytics: ^5.0.7
  google_sign_in: ^7.2.0
  # Sign in with Apple (required by App Store Guideline 4.8; flows into Firebase Auth)
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.3

  # Local Notifications
  flutter_local_notifications: ^22.0.1

  # Navigation
  go_router: ^17.0.1

  # Maps
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^8.2.2

  # Location/GPS
  geolocator: ^14.0.2

  # Animations
  flutter_animate: ^4.5.0

  # UI/Fonts
  google_fonts: ^8.0.0

  # Image Handling
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  image_picker: ^1.1.2

  # Video Handling
  video_player: ^2.9.2
  chewie: ^1.10.0

  # Utilities
  intl: ^0.20.1
  uuid: ^4.5.1
  equatable: ^2.0.7

  # File Handling
  file_picker: ^12.0.0-beta.5
  url_launcher: ^6.2.0
  http_parser: ^4.1.2
  path_provider: ^2.1.5
  # Imported directly by the Drift database for file paths.
  path: ^1.9.0

  # PDF Viewer
  pdfx: ^2.6.0

  # Logging
  logger: ^2.5.0

  # Environment Configuration
  flutter_dotenv: ^6.0.0

  # Offline Database
  drift: ^2.31.0
  drift_flutter: ^0.3.0

  # Connectivity
  connectivity_plus: ^7.0.0

  # In-App Purchases (OpenIAP: Play Billing 9.1 / StoreKit 2)
  flutter_inapp_purchase: ^10.6.1

  # In-App Update (Android only; no-op on iOS)
  in_app_update: ^4.2.3

  # Markdown Rendering
  flutter_markdown: ^0.7.6

  # Ads (free users only; gated by isPremiumProvider). Bundles the UMP consent SDK.
  google_mobile_ads: ^9.0.0

  # iOS App Tracking Transparency prompt (required before personalized ads on iOS)
  app_tracking_transparency: ^2.0.6

  cupertino_icons: ^1.0.8
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Used by test/session/late_response_isolation_test.dart to point the
  # database at a temporary directory. Already present transitively; declared
  # so the analyzer does not flag the import.
  path_provider_platform_interface: ^2.1.2

  # Code Generation
  build_runner: ^2.4.14
  riverpod_generator: ^4.0.0+1
  go_router_builder: ^4.1.3
  retrofit_generator: ^10.2.0
  json_serializable: ^6.8.0

  # Drift Code Generation
  drift_dev: ^2.31.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # Assets
  assets:
    - .env
    - assets/legal/
